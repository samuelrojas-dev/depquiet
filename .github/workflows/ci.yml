name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/ benchmarks/evaluate.py benchmarks/reviews.py benchmarks/reference/run.py benchmarks/reference/run_reviewed.py
      - name: Ruff format check
        run: ruff format --check src/ tests/ benchmarks/evaluate.py benchmarks/reviews.py benchmarks/reference/run.py benchmarks/reference/run_reviewed.py
      - name: Mypy
        run: |
          mypy src/depquiet/ --ignore-missing-imports
          mypy benchmarks/reviews.py --strict

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest tests/ -v -m "not live" --cov=depquiet --cov-report=xml --cov-report=term-missing
      - name: Evaluate controlled reference cases
        run: |
          python benchmarks/reference/run.py --output synthetic-scan.json
          python benchmarks/evaluate.py --labels benchmarks/reference/synthetic.labels.json --scan synthetic-scan.json --snapshot benchmarks/reference/synthetic.snapshot.json --json
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml
          fail_ci_if_error: false

  reviewed-reference:
    name: Upstream reference (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: node-express-realworld
            repository: gothinkster/node-express-realworld-example-app
            commit: 30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
          - project: node-express-boilerplate
            repository: hagopj13/node-express-boilerplate
            commit: 179ae84efec61b14206d0305d941daed6c6d07f9
          - project: mealie
            repository: mealie-recipes/mealie
            commit: 01713b04163e9524b2665ad8089148b6d2f90233
          - project: paperless-ngx
            repository: paperless-ngx/paperless-ngx
            commit: 09d70ed7da7f56b9c197a57518fd363a1fddc3ff
    steps:
      - uses: actions/checkout@v7
        with:
          path: depquiet
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: reference-source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Replay frozen audit against pinned source
        working-directory: depquiet
        env:
          REFERENCE_PROJECT: ${{ matrix.project }}
        run: |
          python benchmarks/reference/run_reviewed.py --snapshot "benchmarks/reference/real/$REFERENCE_PROJECT.snapshot.json" --source-dir ../reference-source --output upstream-scan.json
          python benchmarks/evaluate.py --labels "benchmarks/reference/real/$REFERENCE_PROJECT.labels.json" --scan upstream-scan.json --snapshot "benchmarks/reference/real/$REFERENCE_PROJECT.snapshot.json" --reviews "benchmarks/reference/reviews/$REFERENCE_PROJECT.pending.json" --json > upstream-evaluation.json
          if [ "$REFERENCE_PROJECT" = "node-express-realworld" ]; then
            python benchmarks/reference/run_reviewed.py --snapshot benchmarks/reference/extensions/realworld-configuration.snapshot.json --source-dir ../reference-source --output configuration-scan.json
            python benchmarks/evaluate.py --labels benchmarks/reference/extensions/realworld-configuration.labels.json --scan configuration-scan.json --snapshot benchmarks/reference/extensions/realworld-configuration.snapshot.json --reviews benchmarks/reference/reviews/realworld-configuration.pending.json --json > configuration-evaluation.json
          fi
      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-${{ matrix.project }}
          path: |
            depquiet/upstream-scan.json
            depquiet/upstream-evaluation.json
            depquiet/configuration-scan.json
            depquiet/configuration-evaluation.json
          if-no-files-found: ignore

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # SARIF upload step, push to main only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: npm project
        id: npm
        uses: ./
        with:
          path: benchmarks/fixtures/real-npm-express/project
          offline: "true"
          fail-on-action: "false"
          # Exercise the Action's artifact uploads (upload-artifact), which
          # Dependabot bumps.
          sbom: depquiet-sbom.json
          vex: depquiet-vex.json
      - name: SARIF upload through the Action
        # Fork pull requests get a read-only token, so only on push.
        if: github.event_name == 'push'
        uses: ./
        with:
          path: benchmarks/fixtures/real-npm-express/project
          offline: "true"
          fail-on-action: "false"
          sarif: depquiet.sarif
      - name: Python project (pip-audit on uv.lock)
        id: python
        uses: ./
        with:
          path: tests/fixtures/action-python
          offline: "true"
          fail-on-action: "false"
      - name: Check outputs
        env:
          NPM_TOTAL: ${{ steps.npm.outputs.total }}
          NPM_FILTERED: ${{ steps.npm.outputs.filtered }}
          PY_TOTAL: ${{ steps.python.outputs.total }}
          PY_FILTERED: ${{ steps.python.outputs.filtered }}
          PY_ACTION: ${{ steps.python.outputs.action }}
        run: |
          test -s depquiet-sbom.json || { echo "SBOM not written"; exit 1; }
          test -s depquiet-vex.json || { echo "VEX not written"; exit 1; }
          echo "npm: total=$NPM_TOTAL filtered=$NPM_FILTERED"
          echo "python: total=$PY_TOTAL filtered=$PY_FILTERED action=$PY_ACTION"
          # Advisories change; assert the shape, not exact counts.
          test "$NPM_TOTAL" -gt 0 && test "$NPM_FILTERED" -gt 0
          # black (dev group only) is filtered, requests (production) is not.
          test "$PY_TOTAL" -gt 1 && test "$PY_FILTERED" -gt 0 && test "$PY_ACTION" -gt 0

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, reviewed-reference, action]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install built wheel
        run: pip install --no-deps dist/*.whl
      - name: Smoke test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "from depquiet.filters.templates import TemplateFilter; assert TemplateFilter().count == 20"
          python -I -c "from depquiet.npm_components import NpmComponentResolver; from depquiet.npm_semver import match_npm_range; assert match_npm_range('1.2.3', '<2.0.0')[0] == 'matched'"
          python -I -c "from depquiet.workspaces import discover_workspaces; from depquiet.filters.dynamic_imports import python_dynamic_imports; assert python_dynamic_imports('__import__(name)')[0].target is None"
          depquiet --help
          depquiet baseline create --help
          depquiet diff --help
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
