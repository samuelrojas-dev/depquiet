name: Release

# Releasing is one step: merge the release pull request.
#
# 1. The merge lands on main with a new version in pyproject.toml. The `tag`
#    job sees a version that has no tag yet, tags that exact commit, and
#    starts this workflow again on the tag.
# 2. On the tag, `verify` and `release` run as before: the tag must match the
#    package version, lint, types and tests must pass, then PyPI.
#
# Pushing a tag by hand still works. A tag pushed with GITHUB_TOKEN does not
# start workflows, which is why step 1 starts the run itself (workflow_dispatch
# is the documented exception).
on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag a new version
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write # start the release run on it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pyproject.toml version '$version' is not X.Y.Z; not tagging."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag already exists: nothing to release."
            exit 0
          fi
          # A release commit is a deliberate one: both version files agree and
          # the changelog has the section. Anything else is a half-done bump.
          if ! grep -q "^__version__ = \"$version\"$" src/depquiet/__init__.py; then
            echo "::error::src/depquiet/__init__.py does not say $version; not tagging."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version; not tagging."
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
          echo "Tagged $GITHUB_SHA as $tag and started the release."

  verify:
    name: Verify (lint, types, tests, version)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(python -c 'import depquiet; print(depquiet.__version__)')"
          if [ "$pkg" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match depquiet.__version__ ($pkg)"
            exit 1
          fi
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/depquiet/ --ignore-missing-imports
      - name: Tests
        run: python -m pytest tests/ -q -m "not live"

  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*

      # `uses: samuelrojas-dev/depquiet@v0` follows the latest v0.x release.
      - name: Move major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" HEAD
          git push -f origin "refs/tags/$major"

  mcp-registry:
    # List the release on the MCP Registry (registry.modelcontextprotocol.io),
    # where coding-agent users look for servers. server.json names the PyPI
    # package; the registry checks the `mcp-name:` line in its README.
    # A failure here does not undo the release: PyPI and GitHub are done.
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # GitHub OIDC login: no secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: server.json matches the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$(jq -r .version server.json)" = "$version"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
      - name: Install mcp-publisher (pinned, checksum verified)
        env:
          VERSION: v1.8.9
          SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        # PyPI can take a minute to serve the new README the registry checks.
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          exit 1
