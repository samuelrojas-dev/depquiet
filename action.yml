name: "depquiet — Vulnerability Alert Triage"
description: "Triage pip-audit, uv audit and npm audit alerts: drop those that only reach dev tooling, and check if each fix installs."
author: "Samuel Rojas"

branding:
  icon: "shield"
  color: "green"

inputs:
  path:
    description: "Project path to scan"
    required: false
    default: "."
  scanner:
    description: "Limit the scan to one scanner: npm, pnpm, pip or uv (default: every ecosystem the project declares)"
    required: false
    default: ""
  epss-threshold:
    description: "Filter alerts with an EPSS score below this (0.0-1.0). Empty (default): EPSS only orders the report."
    required: false
    default: ""
  offline:
    description: "Skip EPSS API calls"
    required: false
    default: "false"
  sarif:
    description: "Path to write SARIF output (for GitHub Code Scanning)"
    required: false
    default: ""
  templates:
    description: "Path to additional template directory"
    required: false
    default: ""
  policy:
    description: "Path to policy YAML file (default: .depquiet-policy.yaml in project root)"
    required: false
    default: ""
  sbom:
    description: "Path to write SBOM (.json/.xml for CycloneDX, .spdx.json for SPDX 2.3)"
    required: false
    default: ""
  sbom-format:
    description: "SBOM format: json (CycloneDX, default), xml (CycloneDX), or spdx (SPDX 2.3). Inferred from extension if omitted."
    required: false
    default: ""
  from-sbom:
    description: "Path to a CycloneDX or SPDX JSON SBOM to triage (instead of running a scanner)"
    required: false
    default: ""
  ignore:
    description: "Path to .depquiet-ignore suppression file"
    required: false
    default: ""
  license:
    description: "Run license compliance analysis"
    required: false
    default: "false"
  baseline:
    description: "Path to a previous depquiet --json output. Only NEW findings trigger failure."
    required: false
    default: ""
  kev:
    description: "Check vulnerabilities against the CISA KEV catalog. KEV-listed CVEs are auto-escalated to ACTION."
    required: false
    default: "false"
  kev-file:
    description: "Path to a local KEV catalog JSON file (for air-gapped environments)"
    required: false
    default: ""
  html:
    description: "Write a self-contained interactive HTML report to this file path"
    required: false
    default: ""
  annotations:
    description: "Post inline PR annotations via GitHub Check Runs API (true/false)"
    required: false
    default: "false"
  vex:
    description: "Path to write an OpenVEX document (vulnerability exploitability exchange)"
    required: false
    default: ""
  diff-base:
    description: "Path to a base scan JSON for diff comparison. When set, a diff summary is posted to the PR and GITHUB_STEP_SUMMARY."
    required: false
    default: ""
  pr-comment:
    description: "Post scan diff as a PR comment (requires diff-base, GITHUB_TOKEN, and a pull_request event)"
    required: false
    default: "false"
  fail-on-action:
    description: "Fail the workflow if ACTION items are found (deprecated: use fail-on)"
    required: false
    default: "true"
  fail-on:
    description: "Minimum severity to fail the build: critical, high, moderate, low, none. Overrides fail-on-action when set."
    required: false
    default: ""
  python-version:
    description: "Python version to use"
    required: false
    default: "3.13"
  check-fixes:
    description: "uv projects: ask uv's resolver whether each fix installs, and what blocks it (true/false). Runs uv lock, which can execute build hooks: only for trusted code, not pull_request_target or forks with secrets."
    required: false
    default: "false"
  install-pip-audit:
    description: "Install pip-audit so Python projects are audited (set false if your workflow installs it, or to use uv audit)"
    required: false
    default: "true"
  fix-pr:
    description: "uv projects: open (or update) one pull request with every fix that uv's resolver confirms installs together: requirement changes in pyproject.toml/uv.toml plus uv.lock (true/false). Skipped on pull_request events. Needs contents: write and pull-requests: write. Runs uv lock: trusted code only."
    required: false
    default: "false"
  fix-pr-branch:
    description: "Branch for the fix pull request. It is force-pushed on every run: do not commit to it by hand."
    required: false
    default: "depquiet/security-fixes"
  fix-pr-token:
    description: "Token that pushes the branch and opens the pull request. With the default GITHUB_TOKEN, GitHub does not start your CI workflows on that pull request: pass a personal access token or GitHub App token to have them run."
    required: false
    default: ${{ github.token }}

outputs:
  total:
    description: "Total vulnerabilities found by the audit tool"
    value: ${{ steps.run.outputs.total }}
  filtered:
    description: "Number of vulnerabilities filtered (noise)"
    value: ${{ steps.run.outputs.filtered }}
  action:
    description: "Number of vulnerabilities that need action"
    value: ${{ steps.run.outputs.action }}
  review:
    description: "Number of vulnerabilities that need review"
    value: ${{ steps.run.outputs.review }}
  sarif-file:
    description: "Path to SARIF file (if generated)"
    value: ${{ steps.run.outputs.sarif_file }}
  sbom-file:
    description: "Path to SBOM file (if generated)"
    value: ${{ steps.run.outputs.sbom_file }}
  diff-new:
    description: "Number of new findings in diff (when diff-base is set)"
    value: ${{ steps.diff.outputs.new }}
  diff-fixed:
    description: "Number of fixed findings in diff (when diff-base is set)"
    value: ${{ steps.diff.outputs.fixed }}
  fix-pr-url:
    description: "URL of the fix pull request (when fix-pr opened or updated one)"
    value: ${{ steps.fixpr.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install depquiet
      shell: bash
      env:
        INPUT_INSTALL_PIP_AUDIT: ${{ inputs.install-pip-audit }}
        INPUT_CHECK_FIXES: ${{ inputs.check-fixes }}
        INPUT_FIX_PR: ${{ inputs.fix-pr }}
      # Install the action's own code, so @v0.35.0 runs 0.35.0 and a fresh
      # tag works before PyPI's index lists it. pip-audit is depquiet's
      # scanner for Python projects; without it they fall back to OSV.dev.
      run: |
        python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
        if [ "$INPUT_INSTALL_PIP_AUDIT" = "true" ]; then
          python -m pip install --disable-pip-version-check pip-audit
        fi
        if { [ "$INPUT_CHECK_FIXES" = "true" ] || [ "$INPUT_FIX_PR" = "true" ]; } && ! command -v uv >/dev/null 2>&1; then
          python -m pip install --disable-pip-version-check uv
        fi
        depquiet --version

    - name: Run depquiet
      id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
        INPUT_SCANNER: ${{ inputs.scanner }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_TEMPLATES: ${{ inputs.templates }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_SBOM_FORMAT: ${{ inputs.sbom-format }}
        INPUT_FROM_SBOM: ${{ inputs.from-sbom }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_LICENSE: ${{ inputs.license }}
        INPUT_FAIL_ON_ACTION: ${{ inputs.fail-on-action }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_KEV: ${{ inputs.kev }}
        INPUT_KEV_FILE: ${{ inputs.kev-file }}
        INPUT_HTML: ${{ inputs.html }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_VEX: ${{ inputs.vex }}
        INPUT_CHECK_FIXES: ${{ inputs.check-fixes }}
        INPUT_FIX_PR: ${{ inputs.fix-pr }}
      run: |
        SCAN_DIR=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/depquiet.XXXXXX")
        SCAN_FILE="$SCAN_DIR/scan.json"
        ARGS=(--path "$INPUT_PATH" --json)

        if [ -n "$INPUT_EPSS_THRESHOLD" ]; then
          ARGS+=(--epss-threshold "$INPUT_EPSS_THRESHOLD")
        fi

        if [ "$INPUT_OFFLINE" = "true" ]; then
          ARGS+=(--offline)
        fi

        if [ -n "$INPUT_SCANNER" ]; then
          ARGS+=(--scanner "$INPUT_SCANNER")
        fi

        if [ -n "$INPUT_SARIF" ]; then
          ARGS+=(--sarif "$INPUT_SARIF")
          echo "sarif_file=$INPUT_SARIF" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$INPUT_TEMPLATES" ]; then
          ARGS+=(--templates "$INPUT_TEMPLATES")
        fi

        if [ -n "$INPUT_POLICY" ]; then
          ARGS+=(--policy "$INPUT_POLICY")
        fi

        if [ -n "$INPUT_SBOM" ]; then
          ARGS+=(--sbom "$INPUT_SBOM")
          echo "sbom_file=$INPUT_SBOM" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$INPUT_SBOM_FORMAT" ]; then
          ARGS+=(--sbom-format "$INPUT_SBOM_FORMAT")
        fi

        if [ -n "$INPUT_FROM_SBOM" ]; then
          ARGS+=(--from-sbom "$INPUT_FROM_SBOM")
        fi

        if [ -n "$INPUT_IGNORE" ]; then
          ARGS+=(--ignore "$INPUT_IGNORE")
        fi

        if [ "$INPUT_LICENSE" = "true" ]; then
          ARGS+=(--license)
        fi

        if [ -n "$INPUT_FAIL_ON" ]; then
          ARGS+=(--fail-on "$INPUT_FAIL_ON")
        fi

        if [ -n "$INPUT_BASELINE" ]; then
          ARGS+=(--baseline "$INPUT_BASELINE")
        fi

        if [ "$INPUT_KEV" = "true" ]; then
          ARGS+=(--kev)
        fi

        if [ -n "$INPUT_KEV_FILE" ]; then
          ARGS+=(--kev-file "$INPUT_KEV_FILE")
        fi

        if [ -n "$INPUT_HTML" ]; then
          ARGS+=(--html "$INPUT_HTML")
        fi

        if [ "$INPUT_ANNOTATIONS" = "true" ]; then
          ARGS+=(--annotations "$SCAN_DIR/annotations.json")
        fi

        if [ -n "$INPUT_VEX" ]; then
          ARGS+=(--vex "$INPUT_VEX")
        fi

        if [ "$INPUT_CHECK_FIXES" = "true" ]; then
          ARGS+=(--check-fixes)
        fi

        # The fix pull request: apply the verified plan here, push it in a
        # later step. Never on pull request events: uv lock can run build
        # hooks, and that step holds a token with write access.
        if [ "$INPUT_FIX_PR" = "true" ]; then
          case "${GITHUB_EVENT_NAME:-}" in
            pull_request|pull_request_target)
              echo "::notice::depquiet: fix-pr is skipped on pull request events."
              ;;
            *)
              ARGS+=(--fix-plan "$SCAN_DIR/fix-plan.diff" --apply --fix-plan-report "$SCAN_DIR/fix-pr.md")
              echo "fix_report=$SCAN_DIR/fix-pr.md" >> "$GITHUB_OUTPUT"
              ;;
          esac
        fi

        # Job summary — always write when GITHUB_STEP_SUMMARY is available
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          ARGS+=(--summary "$GITHUB_STEP_SUMMARY")
        fi

        set +e
        depquiet "${ARGS[@]}" > "$SCAN_FILE"
        EXIT_CODE=$?
        set -e

        cat "$SCAN_FILE"
        # Findings use exit 1. Scanner failures (exit 2+) always fail the step.
        if [ "$EXIT_CODE" -gt 1 ]; then
          exit "$EXIT_CODE"
        fi

        # Validate one JSON document before exposing a scan to downstream steps.
        # Keep stderr out of this file: warnings must not erase valid counters.
        python3 -c '
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as stream:
            data = json.load(stream)
        for key in ("total", "filtered", "action", "review"):
            print("{}={}".format(key, data["summary"][key]))
        ' "$SCAN_FILE" >> "$GITHUB_OUTPUT"
        echo "scan_file=$SCAN_FILE" >> "$GITHUB_OUTPUT"
        if [ "$INPUT_ANNOTATIONS" = "true" ]; then
          echo "annotations_file=$SCAN_DIR/annotations.json" >> "$GITHUB_OUTPUT"
        fi

        # Explicit --fail-on overrides fail-on-action; only findings are optional.
        if [ "$EXIT_CODE" -ne 0 ] && { [ -n "$INPUT_FAIL_ON" ] || [ "$INPUT_FAIL_ON_ACTION" = "true" ]; }; then
          exit "$EXIT_CODE"
        fi

    - name: Post PR annotations
      if: inputs.annotations == 'true' && always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ANNOTATIONS_FILE: ${{ steps.run.outputs.annotations_file }}
      run: |
        if [ ! -f "$ANNOTATIONS_FILE" ]; then
          echo "No annotations file found, skipping"
          exit 0
        fi

        SUMMARY=$(python3 -c "import sys,json; print(json.load(sys.stdin)['summary'])" < "$ANNOTATIONS_FILE" 2>/dev/null || echo "depquiet scan complete")
        CONCLUSION=$(python3 -c "import sys,json; print(json.load(sys.stdin)['conclusion'])" < "$ANNOTATIONS_FILE" 2>/dev/null || echo "neutral")
        ANN_COUNT=$(python3 -c "import sys,json; print(len(json.load(sys.stdin)['annotations']))" < "$ANNOTATIONS_FILE" 2>/dev/null || echo "0")

        if [ "$ANN_COUNT" = "0" ]; then
          echo "No annotations to post"
          # Still create the check run to show success
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f "name=depquiet" \
            -f "head_sha=$GITHUB_SHA" \
            -f "status=completed" \
            -f "conclusion=success" \
            -f "output[title]=depquiet: all clear" \
            -f "output[summary]=$SUMMARY" \
            2>/dev/null || true
          exit 0
        fi

        # Post annotations in batches of 50 (GitHub API limit)
        python3 -c "
        import json, subprocess, os, sys

        with open(os.environ['ANNOTATIONS_FILE'], encoding='utf-8') as f:
            data = json.load(f)

        annotations = data['annotations']
        summary = data['summary']
        conclusion = data['conclusion']
        repo = os.environ['GITHUB_REPOSITORY']
        sha = os.environ['GITHUB_SHA']

        # First call: create the check run with the first batch
        batch_size = 50
        first_batch = annotations[:batch_size]

        payload = {
            'name': 'depquiet',
            'head_sha': sha,
            'status': 'completed',
            'conclusion': conclusion,
            'output': {
                'title': f'depquiet: {len(annotations)} findings',
                'summary': summary,
                'annotations': first_batch,
            },
        }

        result = subprocess.run(
            ['gh', 'api', f'repos/{repo}/check-runs', '--input', '-'],
            input=json.dumps(payload),
            capture_output=True,
            text=True,
        )

        if result.returncode != 0:
            print(f'Warning: failed to create check run: {result.stderr}', file=sys.stderr)
            sys.exit(0)

        # If more than 50 annotations, update with remaining batches
        if len(annotations) > batch_size:
            check_run = json.loads(result.stdout)
            check_run_id = check_run['id']

            for i in range(batch_size, len(annotations), batch_size):
                batch = annotations[i:i + batch_size]
                update = {
                    'output': {
                        'title': f'depquiet: {len(annotations)} findings',
                        'summary': summary,
                        'annotations': batch,
                    },
                }
                subprocess.run(
                    ['gh', 'api', '-X', 'PATCH', f'repos/{repo}/check-runs/{check_run_id}', '--input', '-'],
                    input=json.dumps(update),
                    capture_output=True,
                    text=True,
                )

        print(f'Posted {len(annotations)} annotations to check run')
        " 2>/dev/null || echo "Warning: failed to post annotations"

    - name: Run scan diff
      if: always() && inputs.diff-base != '' && steps.run.outputs.scan_file != ''
      id: diff
      shell: bash
      env:
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        SCAN_FILE: ${{ steps.run.outputs.scan_file }}
      run: |
        DIFF_ARGS=(diff "$INPUT_DIFF_BASE" "$SCAN_FILE")
        DIFF_OUTPUT=$(depquiet "${DIFF_ARGS[@]}" --json)
        printf '%s\n' "$DIFF_OUTPUT" | python3 -c '
        import json, sys
        data = json.load(sys.stdin)
        for key in ("new", "fixed"):
            print("{}={}".format(key, data["summary"][key]))
        ' >> "$GITHUB_OUTPUT"

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          depquiet "${DIFF_ARGS[@]}" --summary "$SCAN_FILE.diff.md"
          cat "$SCAN_FILE.diff.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Post PR comment
      if: always() && steps.diff.outcome == 'success' && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        SCAN_FILE: ${{ steps.run.outputs.scan_file }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        COMMENT=$(depquiet diff "$INPUT_DIFF_BASE" "$SCAN_FILE" --markdown)
        # Delete previous depquiet comment if any
        EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## 🔍 depquiet"))) | .id' 2>/dev/null || true)
        if [ -n "$EXISTING" ]; then
          for CID in $EXISTING; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$CID" 2>/dev/null || true
          done
        fi
        gh pr comment "$PR_NUMBER" --body "$COMMENT"

    - name: Open fix pull request
      id: fixpr
      if: always() && inputs.fix-pr == 'true' && steps.run.outputs.fix_report != ''
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FIX_PR_BRANCH: ${{ inputs.fix-pr-branch }}
        FIX_REPORT: ${{ steps.run.outputs.fix_report }}
        GH_TOKEN: ${{ inputs.fix-pr-token }}
      run: |
        set -euo pipefail
        if [ ! -s "$FIX_REPORT" ]; then
          echo "depquiet: no fix that uv's resolver confirms; no pull request."
          exit 0
        fi
        if [ "${GITHUB_REF_TYPE:-}" != "branch" ] || [ -z "${GITHUB_REF_NAME:-}" ]; then
          echo "::warning::depquiet: fix-pr needs a run on a branch; skipped."
          exit 0
        fi
        BASE="$GITHUB_REF_NAME"
        BRANCH="$INPUT_FIX_PR_BRANCH"
        if [ -z "$BRANCH" ] || [ "$BRANCH" = "$BASE" ]; then
          echo "::error::depquiet: fix-pr-branch must be a branch other than $BASE."
          exit 2
        fi
        cd "$INPUT_PATH"
        # Only what the plan changes: requirement files and the lockfile.
        # ls-files, not "git add" with pathspecs: add fails when one matches nothing.
        git ls-files -z -m -- ':(glob)**/pyproject.toml' ':(glob)**/uv.toml' ':(glob)**/uv.lock' \
          | xargs -0 -r git add --
        if git diff --cached --quiet; then
          echo "depquiet: the plan changed no tracked file; no pull request."
          exit 0
        fi
        TITLE="fix(deps): security fixes verified by depquiet"
        git -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -q -m "$TITLE"
        # Push with the given token even when checkout left its own credentials.
        SERVER="${GITHUB_SERVER_URL:-https://github.com}"
        git -c "http.${SERVER}/.extraheader=" push -q --force \
          "${SERVER/https:\/\//https://x-access-token:${GH_TOKEN}@}/${GITHUB_REPOSITORY}.git" \
          "HEAD:refs/heads/$BRANCH"
        # Leave the checkout as the workflow had it.
        git reset -q --hard HEAD~1
        EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
        if [ -n "$EXISTING" ]; then
          gh pr edit "$EXISTING" --title "$TITLE" --body-file "$FIX_REPORT" >/dev/null
          URL=$(gh pr view "$EXISTING" --json url --jq .url)
        else
          if ! URL=$(gh pr create --head "$BRANCH" --base "$BASE" --title "$TITLE" --body-file "$FIX_REPORT"); then
            echo "::error::depquiet: could not open the pull request. Check that the job has 'pull-requests: write' and that Settings > Actions > General allows GitHub Actions to create pull requests."
            exit 2
          fi
        fi
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "depquiet: fix pull request: $URL"

    - name: Upload SARIF to GitHub
      if: inputs.sarif != '' && always()
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: depquiet

    - name: Upload SBOM artifact
      if: inputs.sbom != '' && always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: depquiet-sbom
        path: ${{ inputs.sbom }}

    - name: Upload VEX artifact
      if: inputs.vex != '' && always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: depquiet-vex
        path: ${{ inputs.vex }}
